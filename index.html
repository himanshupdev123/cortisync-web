
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORTISYNC - Stress Tracker</title>
    
    <!-- Modern PyScript Requirements -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .camera-container {
            position: relative; width: 100%; max-width: 400px; height: 300px;
            background: #000; overflow: hidden; margin: 0 auto; border-radius: 0.5rem;
        }
        #camera-stream { width: 100%; height: 100%; object-fit: cover; }
        .targeting-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100px; height: 100px; border: 3px solid #10B981;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); pointer-events: none;
        }
        .loader {
            border: 4px solid #f3f3f3; border-top: 4px solid #10B981;
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-4">

    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 text-center">
        <h1 class="text-2xl font-bold text-emerald-600 mb-2">CORTISYNC</h1>
                <img
  src="https://raw.githubusercontent.com/himanshupdev123/cortisync-web/main/WhatsApp%20Image%202026-10-16%20at%201.08.28%20AM.jpeg"
  alt="CortiSync"
  style="max-width: 100%; height: auto;"
>
        <p class="text-sm text-gray-500 mb-6">Align the saliva strip within the green box, or upload a photo.</p>

        <!-- MEASURE Phase -->
        <div id="ui-measure">
            <div class="camera-container mb-4">
                <video id="camera-stream" autoplay playsinline></video>
                <div class="targeting-box"></div>
            </div>
            <button id="capture-btn" class="bg-emerald-500 text-white font-bold py-2 px-6 rounded-full hover:bg-emerald-600 w-full transition mb-3">
                Capture via Camera
            </button>
            <button id="upload-btn" class="bg-gray-200 text-gray-700 font-bold py-2 px-6 rounded-full hover:bg-gray-300 w-full transition">
                Upload from Gallery
            </button>
            <input type="file" id="file-upload" accept="image/*" class="hidden">
        </div>

        <!-- LOADING State -->
        <div id="ui-loading" class="hidden py-10">
            <div class="loader mb-4"></div>
            <p class="text-gray-600 font-semibold text-sm animate-pulse">Running AI Analysis...</p>
        </div>

        <!-- Hidden Data Transfer -->
        <canvas id="capture-canvas" style="display: none;"></canvas>
        <input type="hidden" id="rgb-data">
        
        <!-- Modern py-click binding -->
        <button id="trigger-python-btn" py-click="process_strip" style="display: none;"></button>

        <!-- RESULTS Phase -->
        <div id="ui-results" class="hidden mt-6">
            <h2 class="text-xl font-bold mb-2">Analysis Complete</h2>
            <div id="result-status" class="text-lg font-semibold py-2 px-4 rounded-md mb-2"></div>
            <p class="text-sm text-gray-600 mb-4" id="result-details"></p>
            
            <div class="bg-gray-100 p-4 rounded-md text-left">
                <h3 class="font-bold text-sm text-gray-500 uppercase tracking-wider mb-1">Action Plan</h3>
                <p id="result-action" class="text-gray-800"></p>
            </div>
            <button onclick="location.reload()" class="mt-6 text-emerald-600 underline text-sm">Scan another strip</button>
        </div>
    </div>

    <!-- JavaScript: Extracts pixels instantly -->
    <script>
        const video = document.getElementById('camera-stream');
        const canvas = document.getElementById('capture-canvas');
        const context = canvas.getContext('2d', { willReadFrequently: true });
        
        const captureBtn = document.getElementById('capture-btn');
        const uploadBtn = document.getElementById('upload-btn');

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => { video.srcObject = stream; })
        .catch(err => { console.warn("Camera unavailable.", err); });

        captureBtn.addEventListener('click', () => {
            if (!video.srcObject) return alert("Camera not active. Use Upload.");
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            extractColorAndTrigger();
        });

        uploadBtn.addEventListener('click', () => document.getElementById('file-upload').click());

        document.getElementById('file-upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width; canvas.height = img.height;
                    context.drawImage(img, 0, 0, canvas.width, canvas.height);
                    extractColorAndTrigger();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function extractColorAndTrigger() {
            const boxWidth = canvas.width * 0.2;
            const boxHeight = canvas.height * 0.2;
            const startX = (canvas.width - boxWidth) / 2;
            const startY = (canvas.height - boxHeight) / 2;

            const imageData = context.getImageData(startX, startY, boxWidth, boxHeight);
            const data = imageData.data;
            
            let r = 0, g = 0, b = 0;
            const pixelCount = data.length / 4;

            for (let i = 0; i < data.length; i += 4) {
                r += data[i];
                g += data[i + 1];
                b += data[i + 2];
            }

            const avgR = r / pixelCount;
            const avgG = g / pixelCount;
            const avgB = b / pixelCount;

            document.getElementById('rgb-data').value = `${avgR},${avgG},${avgB}`;
            
            document.getElementById('ui-measure').classList.add('hidden');
            document.getElementById('ui-loading').classList.remove('hidden');
            
            // Trigger Python click
            setTimeout(() => { document.getElementById('trigger-python-btn').click(); }, 150);
        }
    </script>

    <!-- Modern Python Logic Tag -->
    <!-- Modern Python Logic Tag -->
    <script type="py">
        import colorsys
        from pyscript import document

        def update_ui(status, bg_color, action, intensity):
            document.getElementById('ui-loading').classList.add('hidden')
            document.getElementById('ui-results').classList.remove('hidden')
            
            status_div = document.getElementById('result-status')
            status_div.innerText = status
            status_div.className = f"text-lg font-semibold py-2 px-4 rounded-md mb-2 {bg_color}"
            
            if intensity >= 0:
                document.getElementById('result-details').innerText = f"Color Data: Saturation {round(intensity, 1)}%"
            else:
                document.getElementById('result-details').innerText = "Unable to process image data."
                
            document.getElementById('result-action').innerText = action

        def process_strip(event):
            try:
                rgb_string = document.getElementById('rgb-data').value
                r_str, g_str, b_str = rgb_string.split(',')
                
                avg_r = float(r_str)
                avg_g = float(g_str)
                avg_b = float(b_str)
                
                # Convert RGB to HSV 
                h, s, v = colorsys.rgb_to_hsv(avg_r / 255.0, avg_g / 255.0, avg_b / 255.0)
                
                # Convert Saturation to a 0-100% scale for easy thresholding
                saturation_percent = s * 100
                
                # Evaluate based on color intensity (Light, Medium, Dark)
                if saturation_percent < 30:
                    status = "Low Cortisol"
                    bg_color = "bg-green-100 text-green-800"
                    action = "Within expected range. Maintain your current routine."
                elif 30 <= saturation_percent < 60:
                    status = "Moderate Cortisol"
                    bg_color = "bg-yellow-100 text-yellow-800"
                    action = "Elevated levels detected. Monitor and consider a short break."
                else:
                    status = "High Cortisol"
                    bg_color = "bg-red-100 text-red-800"
                    action = "Abnormal levels. Clinical evaluation recommended. Initiate a 4-7-8 deep breathing protocol."

                update_ui(status, bg_color, action, saturation_percent)
                
            except Exception as e:
                update_ui("Analysis Error", "bg-red-200 text-red-900", f"System diagnostic: {str(e)}", -1)
    </script>
</body>
</html>
